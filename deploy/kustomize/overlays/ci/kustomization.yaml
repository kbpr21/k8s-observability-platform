apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: gateway
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: orders
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 30m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 48Mi
    target:
      kind: Deployment
      name: gateway
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 30m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 48Mi
    target:
      kind: Deployment
      name: orders
