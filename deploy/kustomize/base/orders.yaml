apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: app
  labels:
    app: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: orders:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: web
              containerPort: 8000
          env:
            - name: APP_REDIS_HOST
              value: "redis.app.svc.cluster.local"
            - name: APP_REDIS_PORT
              value: "6379"
            - name: PAYMENTS_SERVICE_URL
              value: "http://payments.app.svc.cluster.local:8000/charge"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: app
  labels:
    app: orders
spec:
  type: ClusterIP
  selector:
    app: orders
  ports:
    - name: web
      port: 8000
      targetPort: 8000
